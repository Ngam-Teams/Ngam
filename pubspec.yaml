name: ngam
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  supabase_flutter: ^2.8.0
  provider: ^6.1.2
  google_fonts: ^6.2.1
  intl: ^0.20.2
  uuid: ^4.5.1
  liquid_glass_widgets: ^0.5.0
  hugeicons: ^1.1.7
  flutter_localizations:
    sdk: flutter
  speech_to_text: ^7.4.0
  http: ^1.2.0
  easy_localization: ^3.0.8
  image_picker: ^1.2.1
  cached_network_image: ^3.4.1
  local_auth: ^2.3.0
  flutter_native_splash: ^2.4.7
  flutter_map: ^8.3.0
  latlong2: ^0.9.1
  geolocator: ^14.0.2
  firebase_core: ^4.11.0
  firebase_messaging: ^16.4.0
  flutter_local_notifications: ^20.1.0
  flutter_dotenv: ^6.0.1
  url_launcher: ^6.3.2
  file_picker: ^11.0.2
  open_filex: ^4.7.0
  path_provider: ^2.1.5
  sqflite: ^2.4.2
  path: ^1.9.1
  shared_preferences: ^2.5.3
  fl_chart: 0.69.0
  liquid_glass_renderer: ^0.2.0-dev.4
  shimmer: ^3.0.0
  flutter_map_marker_cluster: ^8.2.2
  flutter_tts: ^4.2.5
  font_awesome_flutter: ^10.9.1
  google_sign_in: ^7.2.0
  mobile_scanner: ^6.0.0
  qr_flutter: ^4.1.0
  image: any

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/translations/
    - assets/app.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/app.png"

flutter_native_splash:
  color: "#ffffff"
  color_dark: "#0b0b0b"
  image: "assets/splash.png"
  image_dark: "assets/splash.png"
  android: true
  ios: true
