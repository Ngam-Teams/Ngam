name: Deploy PWA to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - 'lib/**'
      - 'web/**'
      - 'assets/**'
      - 'pubspec.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Build & Deploy Flutter Web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Configure Environment (.env)
        run: |
          if [ -n "${{ secrets.ENV_FILE }}" ]; then
            echo "${{ secrets.ENV_FILE }}" > .env
          elif [ ! -f .env ]; then
            echo "SUPABASE_URL=https://rsueaoglsdxhzpupjljd.supabase.co" > .env
            echo "SUPABASE_ANON_KEY=sb_publishable_qP4whY5B6wxIasWOVGoPCw_vrhOXj_J" >> .env
          fi
        shell: bash

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Web Release
        run: flutter build web --release --no-tree-shake-icons

      - name: Copy Cloudflare Redirects
        run: |
          cp web/_redirects build/web/_redirects || true
        shell: bash

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ngam
          directory: build/web
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
