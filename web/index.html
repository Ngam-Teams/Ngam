  <!-- PWA Theme Color Auto-sync & Bridge -->
  <script>
    (function() {
      try {
        var isDarkPref = localStorage.getItem('flutter.theme_mode');
        var isDark = isDarkPref !== null
          ? isDarkPref === 'true'
          : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        var color = isDark ? '#0A0A14' : '#F8F9FA';
        var metas = document.querySelectorAll('meta[name="theme-color"]');
        metas.forEach(function(m) {
          if (!m.getAttribute('media')) {
            m.setAttribute('content', color);
          }
        });
        if (document.body) {
          document.body.style.backgroundColor = color;
        }
      } catch (e) {}
    })();

    window.updatePwaThemeColor = function(isDark) {
      try {
        var color = isDark ? '#0A0A14' : '#F8F9FA';
        var metas = document.querySelectorAll('meta[name="theme-color"]');
        metas.forEach(function(m) {
          if (!m.getAttribute('media')) {
            m.setAttribute('content', color);
          }
        });
        if (document.body) {
          document.body.style.backgroundColor = color;
        }
      } catch (e) {}
    };
  </script>

  <style>
    html, body {
      background-color: #000000;
      margin: 0;
      padding: 0;
      overflow: hidden;
      height: 100%;
    }
    #ngam-splash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #000000;
      z-index: 99999;
      transition: opacity 0.35s ease-out;
      user-select: none;
    }
    .splash-logo {
      width: 76px;
      height: 76px;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(33, 150, 243, 0.25);
      margin-bottom: 22px;
      animation: splash-pulse 2s infinite ease-in-out;
    }
    .splash-spinner {
      width: 24px;
      height: 24px;
      border: 2.5px solid rgba(255, 255, 255, 0.12);
      border-top-color: #2196F3;
      border-radius: 50%;
      animation: splash-spin 0.8s linear infinite;
    }
    @keyframes splash-spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes splash-pulse {
      0%, 100% { transform: scale(1); opacity: 0.95; }
      50% { transform: scale(1.04); opacity: 1; filter: drop-shadow(0 0 16px rgba(33, 150, 243, 0.45)); }
    }
      /* Sembunyikan #ngam-splash jika dibuka sebagai PWA Standalone di Android/iOS */
    /* Chrome WebAPK sudah ada native OS splash screen sendiri, elak duplicate splash */
    @media (display-mode: standalone), (display-mode: fullscreen), (display-mode: minimal-ui) {
      #ngam-splash {
        display: none !important;
      }
    }
  </style>
  <script>
    (function() {
      var isStandalone = window.matchMedia('(display-mode: standalone)').matches ||
                         window.navigator.standalone === true ||
                         document.referrer.includes('android-app://');
      if (isStandalone) {
        var style = document.createElement('style');
        style.textContent = '#ngam-splash { display: none !important; }';
        document.head.appendChild(style);
      }
    })();
  </script>
</head>
<body style="background-color: #000000;">
  <div id="ngam-splash">
    <img src="icons/splash-logo.png" alt="Ngam" class="splash-logo">
    <div class="splash-spinner"></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('ngam-splash');
      if (splash) {
        splash.style.opacity = '0';
        setTimeout(function () {
          if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
        }, 350);
      }
    });
  </script>
  <script>
    // Native Browser PWA Install Prompt Automation for Ngam
    window.deferredPWAInstallPrompt = null;
    var hasPromptedNativeInstall = false;

    window.addEventListener('beforeinstallprompt', function (e) {
      // Capture the browser's native install event
      window.deferredPWAInstallPrompt = e;

      // Check if user already saw or interacted with the prompt in this session
      if (sessionStorage.getItem('ngam_native_pwa_prompted') === 'true') {
        return;
      }

      function triggerBrowserNativePrompt() {
        if (window.deferredPWAInstallPrompt && !hasPromptedNativeInstall) {
          hasPromptedNativeInstall = true;
          sessionStorage.setItem('ngam_native_pwa_prompted', 'true');
          window.removeEventListener('click', triggerBrowserNativePrompt, true);
          window.removeEventListener('touchend', triggerBrowserNativePrompt, true);

          // Give command to the browser to display its official native install prompt!
          window.deferredPWAInstallPrompt.prompt().then(function (choiceResult) {
            console.log('[PWA] Native install choice:', choiceResult.outcome);
            window.deferredPWAInstallPrompt = null;
          }).catch(function (err) {
            console.log('[PWA] Native prompt notice:', err);
          });
        }
      }

      // Command browser to pop up native install on the first user interaction
      window.addEventListener('click', triggerBrowserNativePrompt, true);
      window.addEventListener('touchend', triggerBrowserNativePrompt, true);
    });

    window.addEventListener('appinstalled', function () {
      window.deferredPWAInstallPrompt = null;
      sessionStorage.setItem('ngam_native_pwa_prompted', 'true');
      console.log('[PWA] Ngam app installed natively on device.');
    });
  </script>
